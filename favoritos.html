<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Favoritos — Baby Kids</title>
  <script src="js/app.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
  <link href="https://fonts.googleapis.com/css?family=Work+Sans:200,400&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Work Sans', sans-serif; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card-anim { animation: fadeIn 0.3s ease forwards; }
  </style>
</head>
<body class="bg-gray-50 text-gray-700 min-h-screen">

  <!-- NAVBAR -->
  <nav class="bg-white border-b border-gray-100 shadow-sm">
    <div class="container mx-auto flex items-center justify-between px-6 py-4">
  <a href="index.html" class="no-underline">
 <img src="img/logo.jpeg" alt="Baby Kids" class="h-12 w-12 rounded-full object-cover">
</a>
      <a href="index.html" class="text-sm text-gray-500 hover:text-gray-800 transition no-underline">← Voltar à loja</a>
    </div>
  </nav>

  <!-- CONTEÚDO -->
  <main class="container mx-auto px-6 py-10">

    <div class="flex items-center gap-3 mb-8">
      <svg class="h-7 w-7 text-red-500 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 6 4 4 6.5 4 8.04 4 9.54 4.81 10.35 6.09 11.16 4.81 12.66 4 14.2 4 16.7 4 18.7 6 18.7 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
      <h1 class="text-3xl font-bold text-gray-800">Meus Favoritos</h1>

    <!-- Grid -->
    <div id="lista-favoritos" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>

    <!-- Estado vazio -->
    <div id="favoritos-vazio" class="hidden flex-col items-center justify-center py-24 text-center">
      <svg class="h-20 w-20 text-gray-200 mb-5 fill-current" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 6 4 4 6.5 4 8.04 4 9.54 4.81 10.35 6.09 11.16 4.81 12.66 4 14.2 4 16.7 4 18.7 6 18.7 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>

      <p class="text-gray-400 text-sm mb-6">Explore nossos produtos e salve os que você amar ❤️</p>
      <a href="index.html" class="bg-gray-900 text-white font-semibold px-8 py-3 rounded-xl hover:bg-gray-700 transition no-underline text-sm">
        Explorar produtos
      </a>
    </div>

  </main>

  <script src="js/favoritos.js"></script>

</html>
